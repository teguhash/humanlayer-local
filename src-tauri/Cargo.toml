[package]
name = "humanlayer-local"
version = "0.1.0"
description = "HumanLayer Local: a local-only desktop app for running Claude Code and Codex through research, plan, implement and review"
authors = ["teguhash"]
license = "Apache-2.0"
repository = "https://github.com/teguhash/humanlayer-local"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "humanlayer_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
hl-core = { path = "crates/core" }
hl-agents = { path = "crates/agents" }
tokio = { workspace = true }
hl-git = { path = "crates/git" }
notify = "8"
hl-linear = { path = "crates/linear" }
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace]
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "rt"] }
